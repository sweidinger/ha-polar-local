set_plans:
  fields:
    device_id:
      selector:
        device:
          integration: polar_local
    plans:
      required: true
      example: '[{"plate": 1, "time": "07:00", "duration": 30}, {"plate": 2, "time": "12:30", "duration": 30}]'
      selector:
        object:
clear_plans:
  fields:
    device_id:
      selector:
        device:
          integration: polar_local
feed_now:
  fields:
    device_id:
      selector:
        device:
          integration: polar_local
    plate:
      selector:
        number:
          min: 1
          max: 3
    duration:
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
stop_feeding:
  fields:
    device_id:
      selector:
        device:
          integration: polar_local
send_command:
  fields:
    device_id:
      selector:
        device:
          integration: polar_local
    topic:
      default: service
      selector:
        select:
          options: [service, config, ota, event, ntp]
    payload:
      required: true
      example: '{"cmd": "GET_SOME_ATTR_SERVICE", "attrKeys": ["platePosition"]}'
      selector:
        object:
